# 유저 데이터 전용 DB. 과목 데이터는 data/depts/*.json이 소스다.
# 이 컨테이너가 안 떠도 코어(게스트 → 입력 → 로드맵)는 동작한다.
services:
  db:
    image: postgres:16-alpine
    container_name: mjc-db
    environment:
      POSTGRES_USER: mjc
      POSTGRES_PASSWORD: mjc
      POSTGRES_DB: mjc
    ports:
      # 5432는 로컬 PostgreSQL이 이미 쓰는 경우가 있다. 그러면 파이썬이 그쪽에 붙어
      # "mjc 사용자 인증 실패"가 나는데, 연결 거부가 아니라 거절이라 원인이 안 보인다
      - "5433:5432"
    volumes:
      - mjc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mjc -d mjc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mjc-pgdata:
